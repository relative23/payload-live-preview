<!doctype html>
<!-- Mock admin: frames a target and posts payload-live-preview messages, the
     exact protocol a real Payload admin uses. ?target= chooses the framed page. -->
<html lang="en"><head><meta charset="utf-8"><title>Mock admin</title></head><body>
  <iframe id="preview" data-testid="preview-frame" title="Live preview" style="width:100%;height:600px;border:0"></iframe>
  <script>
    const requested = new URLSearchParams(location.search).get('target') || '/index.html';
    const target = requested.startsWith('/') && !requested.startsWith('//') ? requested : '/index.html';
    document.getElementById('preview').src = target;
  </script>
</body></html>
