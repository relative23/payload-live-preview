# nginx streaming the body on, with its own limit above the endpoint's
# 64 KiB (256 KiB): a larger declared length is refused here, before the upstream is asked.
events {}
http {
  access_log off;
  server {
    listen 4399 ssl;
    http2 on;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    client_max_body_size 256k;
    location / {
      proxy_pass http://127.0.0.1:4393;
      proxy_http_version 1.1;
      proxy_set_header Host $host:$server_port;
      proxy_set_header Connection "";
      proxy_request_buffering off;
    }
  }
}
