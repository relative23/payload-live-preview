# nginx as a deployment would run it: TLS and HTTP/2 at the edge, the request
# body buffered whole before the upstream sees any of it (the default).
events {}
http {
  access_log off;
  server {
    listen 4395 ssl;
    http2 on;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    location / {
      proxy_pass http://127.0.0.1:4393;
      proxy_http_version 1.1;
      proxy_set_header Host $host:$server_port;
      proxy_set_header Connection "";
    }
  }
}
