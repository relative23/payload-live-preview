name: CI

on:
  push:
    branches: [main, release/2.0]
  pull_request:
    branches: [main, release/2.0]

permissions:
  contents: read

concurrency:
  # Release branch runs carry the verdict the Release workflow consumes; never cancel them.
  # `cancel-in-progress: false` alone does not achieve that: GitHub keeps exactly
  # one *pending* run per group and cancels it when the next one arrives, so a
  # merge landing while an earlier main run is still going costs the commit in
  # between its verdict -- 1c64654 and dca7a18 both died that way, with zero jobs
  # ever started. A push therefore gets a group of its own, keyed by sha, and so
  # never queues behind another. Pull requests keep the per-ref group, where
  # superseding the older run is exactly what we want.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # examples/payload-version-lanes/v2 installs payload 2.32.3 and @payloadcms/db-mongodb 1.7.5
          # on purpose: the lane proves the SDK against the last Payload 2 release. These ten
          # advisories (two critical, eight high) are fixed only in Payload 3.79.1, 3.87.0 and 3.90.0
          # and in 4.0.0-canary, never in Payload 2 or its 1.x database adapter, so the lane cannot
          # clear them by upgrading. Drop them together with the lane or its Payload 2 pin.
          allow-ghsas: >-
            GHSA-hp5w-3hxx-vmwf, GHSA-f7hx-52q9-hcrf, GHSA-97rh-rhh2-7vjv,
            GHSA-2pwp-2369-8fg3, GHSA-p223-2wr2-j562, GHSA-7xxh-373w-35vg,
            GHSA-6r7f-q7f5-wpx8, GHSA-9qpg-3cf8-w33x, GHSA-fx49-4h83-wjv9,
            GHSA-4ww4-68q3-h7g5

  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      # The generated runtime is a build output, so every check that imports
      # or type-checks it needs it generated first.
      - run: npm run build:runtime
      # One generated file is committed, and the build just made it again: the
      # two must be the same bytes, or a version bump has gone stale in it.
      - run: npm run check:generated
      - run: npm run audit:gate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:policy
      - run: npm run test:architecture
      - run: npm run compat:check
      - run: npm run diagnostics:check

  unit:
    name: Unit Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The pinned npm exists for reproducible packaging, and that is enforced
      # on the pinned Node elsewhere. Here the point is the opposite: does the
      # package work on each Node it claims? npm 12 needs Node 22.22+, so the
      # oldest supported Node keeps its bundled npm — which is also the npm a
      # consumer on that version actually has. Only an engine mismatch falls
      # back; any other install failure still fails the job.
      - name: Use the repository npm version where this Node supports it
        run: node scripts/use-repository-npm.mjs
      - run: npm ci
      - run: npm run build:runtime
      - run: npm run test:unit
      - run: npm run test:integration

  hook-matrix:
    name: Hooks at the peer floor (React ${{ matrix.react }}, Vue ${{ matrix.vue }}, Svelte ${{ matrix.svelte }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `react >=18`, `vue >=3.3` and `svelte >=5` are promises the unit job cannot keep on its
    # own: it runs what the lockfile installs, React 19 and Vue 3.5. This job
    # installs the floor of each range over the lockfile, without saving it,
    # and runs the suites that touch the framework — the hook, the route
    # refresh component and the fragment renderer. compat:check holds the
    # floors here against the peer ranges and quality/compat-matrix.json.
    strategy:
      fail-fast: false
      matrix:
        react: ['18.0.0']
        vue: ['3.3.0']
        svelte: ['5.0.0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm run build:runtime
      - name: Install the peer floors over the lockfile, without saving them
        run: npm install --no-save --no-audit --no-fund "react@${{ matrix.react }}" "react-dom@${{ matrix.react }}" "@types/react@${{ matrix.react }}" "@types/react-dom@${{ matrix.react }}" "vue@${{ matrix.vue }}" "svelte@${{ matrix.svelte }}"
      - name: State what was installed
        run: node -p "'react ' + require('react/package.json').version + ', react-dom ' + require('react-dom/package.json').version + ', vue ' + require('vue/package.json').version + ', svelte ' + require('svelte/package.json').version"
      - name: Run the hook, route-refresh and fragment suites (Svelte through the real svelte/server)
        run: npx vitest run tests/unit/adapters/react-hook.test.tsx tests/unit/adapters/react-route-refresh.test.tsx tests/unit/adapters/nextjs-fragments.test.ts tests/unit/adapters/vue-composable.test.ts tests/unit/core/hydration-vue.test.ts tests/unit/adapters/nuxt-fragments.test.ts tests/unit/adapters/sveltekit-fragments-real.test.ts tests/unit/adapters/sveltekit-fragments.test.ts

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Diff coverage is computed against the reviewed base commit.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm run build:runtime
      - run: npm run test:coverage
      - name: Enforce changed-line coverage and threshold ratchets
        env:
          COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run test:coverage:diff
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  mutation:
    name: PR Critical Mutation Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm run build:runtime
      - name: Prove critical assertions kill injected faults
        env:
          STRYKER_SCOPE: pr
        run: npm run test:mutation
      - name: Enforce exact zero-error PR mutation baseline
        run: npm run test:mutation:policy:pr
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutation-report-pr
          path: |
            test-results/stryker-pr.json
            test-results/stryker-pr.html
          if-no-files-found: ignore
          retention-days: 7

  fixture-audit:
    name: Fixture Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      # Lockfile-only audits: the advisories are a property of the reviewed
      # lockfiles, not of an installed tree.
      - run: node scripts/audit-gate.ts --package-lock-only --prefix examples/astro-payload
      - run: node scripts/audit-gate.ts --package-lock-only --prefix examples/nextjs-payload
      - run: node scripts/audit-gate.ts --package-lock-only --prefix examples/sveltekit-payload
      - run: node scripts/audit-gate.ts --package-lock-only --prefix examples/nuxt-payload
      - run: node scripts/audit-gate.ts --package-lock-only --prefix examples/astro-hybrid
      - run: node scripts/audit-gate.ts --package-lock-only --prefix examples/pure-html
      - run: node scripts/audit-gate.ts --package-lock-only --prefix examples/vanilla-client
      - run: node scripts/audit-gate.ts --package-lock-only --prefix examples/astro-inline
      - run: node scripts/audit-gate.ts --package-lock-only --prefix examples/astro-middleware
      - run: node scripts/audit-gate.ts --package-lock-only --prefix examples/sveltekit3-payload
      - run: node scripts/audit-gate.ts --package-lock-only --prefix examples/nuxt4-payload
      - run: node scripts/audit-gate.ts --package-lock-only --prefix examples/payload-backend

  # A job that calls a reusable workflow reports its check as
  # "<this name> / <the called job's name>" — here "Build / Build" — and the
  # branch protection on main requires that exact string. When the build moved
  # into build.yml the protection still asked for "Build", which no run could
  # ever report, and every pull request sat BLOCKED with all checks green.
  # Rename this job, or the one in build.yml, and the protection must follow.
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Astro 7.4.2 needs >=22.23.4, and a bare 22 resolved to 22.23.3 on the runners (2026-10-27)
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/*/package-lock.json
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: bash scripts/ci-install-browser.sh ${{ matrix.browser }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ github.sha }}
          path: dist
      # Every fixture installs the freshly built package from its immutable
      # lockfile (`file:../..`, kept in sync by the version script).
      - run: bash scripts/ci-install-fixture.sh examples/astro-payload
      - run: bash scripts/ci-install-fixture.sh examples/nextjs-payload
      - run: bash scripts/ci-install-fixture.sh examples/sveltekit-payload
      - run: bash scripts/ci-install-fixture.sh examples/nuxt-payload
      - run: bash scripts/ci-install-fixture.sh examples/astro-hybrid
      - run: bash scripts/ci-install-fixture.sh examples/pure-html
      - run: bash scripts/ci-install-fixture.sh examples/vanilla-client
      - run: bash scripts/ci-install-fixture.sh examples/astro-inline
      - run: bash scripts/ci-install-fixture.sh examples/astro-middleware
      - run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  # The SvelteKit example's SvelteKit 3 twin (examples/sveltekit3-payload), beside the SvelteKit 2
  # fixture the E2E job serves. The files that test only SvelteKit run whole; the shared ones run
  # their SvelteKit cases, and the byte-for-byte public response is the SvelteKit fixture's too.
  # The public-response rows weigh each page against the runtime the Astro fixture serves, which
  # this job does not start.
  sveltekit3:
    name: SvelteKit 3 E2E (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # SvelteKit 3 needs >=22.17; the job matches the E2E job's Node
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/*/package-lock.json
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: bash scripts/ci-install-browser.sh ${{ matrix.browser }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ github.sha }}
          path: dist
      - run: bash scripts/ci-install-fixture.sh examples/sveltekit3-payload
      - env:
          PLP_E2E_SERVERS: sveltekit
          PLP_SVELTEKIT_FIXTURE: sveltekit3-payload
        run: >-
          npx playwright test --project=${{ matrix.browser }}
          tests/e2e/specs/owner-scoping.spec.ts
          tests/e2e/specs/sveltekit-asset-delivery.spec.ts
          tests/e2e/specs/sveltekit-fragment.spec.ts
          tests/e2e/specs/sveltekit-live-preview.spec.ts
          tests/e2e/specs/sveltekit-owner-fragments.spec.ts
      - env:
          PLP_E2E_SERVERS: sveltekit
          PLP_SVELTEKIT_FIXTURE: sveltekit3-payload
        run: >-
          npx playwright test --project=${{ matrix.browser }} -g "[Ss]velte[Kk]it|byte for byte"
          --grep-invert "public response carries"
          tests/e2e/specs/auto-bind-hit-rate.spec.ts
          tests/e2e/specs/fragment-request-bounds.spec.ts
          tests/e2e/specs/navigation-lifecycle-per-framework.spec.ts
          tests/e2e/specs/public-response.spec.ts
          tests/e2e/specs/reveal.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-sveltekit3-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  # The Nuxt example's Nuxt 4 twin (examples/nuxt4-payload, the `app/` layout), beside the Nuxt 3
  # fixture the E2E job serves. The files that test only Nuxt run whole; the shared ones run their
  # Nuxt cases. The Nuxt public-response row weighs the page against the runtime the Astro fixture
  # serves, which this job does not start.
  nuxt4:
    name: Nuxt 4 E2E (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Nuxt 4.6 needs ^22.22.3; the job matches the E2E job's Node
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/*/package-lock.json
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: bash scripts/ci-install-browser.sh ${{ matrix.browser }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ github.sha }}
          path: dist
      - run: bash scripts/ci-install-fixture.sh examples/nuxt4-payload
      - env:
          PLP_E2E_SERVERS: nuxt
          PLP_NUXT_FIXTURE: nuxt4-payload
        run: >-
          npx playwright test --project=${{ matrix.browser }}
          tests/e2e/specs/nuxt-asset-delivery.spec.ts
          tests/e2e/specs/nuxt-fragment.spec.ts
          tests/e2e/specs/nuxt-live-preview.spec.ts
      - env:
          PLP_E2E_SERVERS: nuxt
          PLP_NUXT_FIXTURE: nuxt4-payload
        run: >-
          npx playwright test --project=${{ matrix.browser }} -g "[Nn]uxt"
          tests/e2e/specs/auto-bind-hit-rate.spec.ts
          tests/e2e/specs/fragment-request-bounds.spec.ts
          tests/e2e/specs/navigation-lifecycle-per-framework.spec.ts
          tests/e2e/specs/reveal.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-nuxt4-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  astro-matrix:
    name: Astro matrix (Astro ${{ matrix.astro }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        astro: [6, 5, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/*/package-lock.json
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: bash scripts/ci-install-browser.sh chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ github.sha }}
          path: dist
      # The install mutates the fixture manifest in this checkout only; the
      # resolved version is printed so the log states what was tested.
      - run: npm --prefix examples/astro-payload install --no-audit --no-fund --dangerously-allow-all-scripts "astro@^${{ matrix.astro }}"
      - run: node -p "'astro ' + require('./examples/astro-payload/node_modules/astro/package.json').version"
      - env:
          PLP_E2E_SERVERS: astro
        run: >-
          npx playwright test --project=chromium
          tests/e2e/specs/accessibility.spec.ts
          tests/e2e/specs/diagnostics.spec.ts
          tests/e2e/specs/island-bridge.spec.ts
          tests/e2e/specs/live-preview.spec.ts
          tests/e2e/specs/navigation-lifecycle.spec.ts
          tests/e2e/specs/root-replacement.spec.ts
          tests/e2e/specs/scenarios.spec.ts
          tests/e2e/specs/structural-morph.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-astro-${{ matrix.astro }}
          path: playwright-report/
          retention-days: 7

  next-matrix:
    name: Next.js matrix (Next ${{ matrix.next }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        next: [15]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/*/package-lock.json
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: bash scripts/ci-install-browser.sh chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ github.sha }}
          path: dist
      # The fixture's lockfile pins the newest Next.js. The install mutates its
      # manifest in this checkout only; the resolved version is printed so the
      # log states what was tested. Next.js 15 builds with webpack, and the
      # base path is where an older Next differs from the newest, so both run
      # beside the development suite.
      - run: npm --prefix examples/nextjs-payload install --no-audit --no-fund "next@^${{ matrix.next }}"
      - run: node -p "'next ' + require('./examples/nextjs-payload/node_modules/next/package.json').version"
      - env:
          PLP_E2E_SERVERS: nextjs
        run: >-
          npx playwright test --project=chromium -g "[Nn]ext"
          tests/e2e/specs/auto-bind-hit-rate.spec.ts
          tests/e2e/specs/fragment-request-bounds.spec.ts
          tests/e2e/specs/navigation-lifecycle-per-framework.spec.ts
          tests/e2e/specs/nextjs-asset-delivery.spec.ts
          tests/e2e/specs/nextjs-fragment.spec.ts
          tests/e2e/specs/nextjs-live-preview.spec.ts
          tests/e2e/specs/reveal.spec.ts
      - run: npm run test:e2e:next-webpack-production -- --project=chromium
      - run: npm run test:e2e:next-base-path -- --project=chromium
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-next-${{ matrix.next }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The two Astro floors the matrix above cannot reach: `astro@^4` installs the newest 4.x, not the
  # lower bound the peer range promises. Both consume the archive the Build job stored, byte for byte
  # what the Release workflow publishes, in a consumer of their own with a reviewed lock.
  # Static base adapter at the peer floor (4.0.0), built in both delivery modes against a mock
  # parent, with two control builds that must fail the same assertions.
  astro-floor-base:
    name: Astro floor 4.0.0 (static base adapter)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # compat:check counts a bare 22 as 22.0.0, and the floor consumer's lock needs 22.20 (2026-10-28)
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/*/package-lock.json
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: bash scripts/ci-install-browser.sh chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ github.sha }}
          path: release-artifact
      - run: PLP_CONTINUATION_TARBALL="$(ls "$PWD"/release-artifact/*.tgz)" npx playwright test --config playwright.astro-floor-base.config.ts --project=chromium
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-astro-floor-base
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # React client:load islands inside native fragments at the first Astro whose container resolves
  # island modules (4.16.19), with the React 18 integration of that era, under the build-hash CSP.
  astro-floor-islands:
    name: Astro floor (React islands, Astro ${{ matrix.astro }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        astro: ['4.16.19']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # The ACL fixture installs Payload 3.92, which needs ^22.23.4; compat:check counts a bare 22 as 22.0.0 (2026-10-28)
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/*/package-lock.json
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: bash scripts/ci-install-browser.sh chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ github.sha }}
          path: release-artifact
      - env:
          PLP_ASTRO_RESOURCE_VERSION: ${{ matrix.astro }}
        run: PLP_CONTINUATION_TARBALL="$(ls "$PWD"/release-artifact/*.tgz)" npx playwright test --config playwright.astro-islands.config.ts --project=chromium
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-astro-floor-islands-${{ matrix.astro }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Native fragment rendering and page-owned resources (ADR 0020) on the exact Astro versions the
  # record names, from the archive the Build job stored. The floor is 4.9.0, where the container takes
  # no props and the packed default renders the catalog; the rest run the verified-context case too.
  astro-fragment-versions:
    name: Astro fragment rendering (Astro ${{ matrix.astro }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        astro: ['4.9.0', '4.16.19', '5.18.2', '6.4.8', '7.3.2', '7.4.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # The ACL fixture installs Payload 3.92, which needs ^22.23.4; compat:check counts a bare 22 as 22.0.0 (2026-10-28)
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/*/package-lock.json
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: bash scripts/ci-install-browser.sh chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ github.sha }}
          path: release-artifact
      - env:
          PLP_ASTRO_RESOURCE_VERSION: ${{ matrix.astro }}
        run: PLP_CONTINUATION_TARBALL="$(ls "$PWD"/release-artifact/*.tgz)" npx playwright test --config playwright.astro-resources.config.ts --project=chromium
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-astro-fragment-${{ matrix.astro }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Next.js, SvelteKit and Nuxt production hosts: each an application of its own on the versions the
  # example locks, with the archive the Build job stored, built for production and served behind TLS.
  # A real Payload 3 signs two editors in and enforces their access; the test sends the editor's
  # messages, not Payload's admin UI.
  production-lifecycle:
    name: Production lifecycle (${{ matrix.framework }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [next, sveltekit, nuxt]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # The ACL fixture installs Payload 3.92, which needs ^22.23.4; compat:check counts a bare 22 as 22.0.0 (2026-10-28)
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/*/package-lock.json
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: bash scripts/ci-install-browser.sh chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ github.sha }}
          path: release-artifact
      - run: PLP_CONTINUATION_TARBALL="$(ls "$PWD"/release-artifact/*.tgz)" npx playwright test --config playwright.${{ matrix.framework }}-continuation.config.ts --project=chromium
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-production-lifecycle-${{ matrix.framework }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  real-payload-e2e:
    name: Real Payload E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Payload 3.92 needs ^22.23.4, and a bare 22 resolved to 22.23.3 on the runners (2026-10-25)
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/*/package-lock.json
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: bash scripts/ci-install-browser.sh chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ github.sha }}
          path: dist
      - run: bash scripts/ci-install-fixture.sh examples/astro-payload
      - run: bash scripts/ci-install-fixture.sh examples/payload-backend
      - run: npm run test:e2e:real-payload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-real-payload
          path: playwright-report/
          retention-days: 7

  real-payload-hybrid:
    name: Real Payload E2E (hybrid, ${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Payload 3.92 needs ^22.23.4, and a bare 22 resolved to 22.23.3 on the runners (2026-10-25)
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/*/package-lock.json
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: bash scripts/ci-install-browser.sh ${{ matrix.browser }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ github.sha }}
          path: dist
      - run: bash scripts/ci-install-fixture.sh examples/astro-hybrid
      - run: bash scripts/ci-install-fixture.sh examples/payload-backend
      - env:
          PLP_REAL_PAYLOAD_TARGET: hybrid
          PLP_REAL_PAYLOAD_BROWSERS: ${{ matrix.browser }}
        run: npm run test:e2e:real-payload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-real-payload-hybrid-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  # The targets whose preview verifies the editor's real session (or, for html, the origin
  # rule) against the real Payload admin; nextjs-autologin frames the Next.js example from an
  # admin that keeps its autoLogin, which issues no cookie; create frames the SvelteKit
  # example's collection pages from an admin that has two collections for the create screen;
  # sveltekit3 and sveltekit3-create are those two SvelteKit targets on the SvelteKit 3 fixture,
  # nuxt4 and nuxt4-composable the two Nuxt targets on the Nuxt 4 fixture. The -production targets
  # build the Next.js, SvelteKit and Nuxt examples for production behind TLS, with the admin behind
  # an HTTPS front, since strict mode accepts only https admin origins there.
  # The fixture each target frames is looked up by name.
  real-payload-surfaces:
    name: Real Payload E2E (${{ matrix.target }}, ${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            nextjs,
            sveltekit,
            nuxt,
            nextjs-hook,
            nuxt-composable,
            html,
            astro-session,
            nextjs-autologin,
            create,
            sveltekit3,
            sveltekit3-create,
            nuxt4,
            nuxt4-composable,
            nextjs-production,
            sveltekit-production,
            nuxt-production,
          ]
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Payload 3.92 needs ^22.23.4, and a bare 22 resolved to 22.23.3 on the runners (2026-10-25)
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/*/package-lock.json
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: bash scripts/ci-install-browser.sh ${{ matrix.browser }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ github.sha }}
          path: dist
      - env:
          EXAMPLE: ${{ fromJSON('{"nextjs":"nextjs-payload","nextjs-hook":"nextjs-payload","sveltekit":"sveltekit-payload","nuxt":"nuxt-payload","nuxt-composable":"nuxt-payload","html":"pure-html","astro-session":"astro-middleware","nextjs-autologin":"nextjs-payload","create":"sveltekit-payload","sveltekit3":"sveltekit3-payload","sveltekit3-create":"sveltekit3-payload","nuxt4":"nuxt4-payload","nuxt4-composable":"nuxt4-payload","nextjs-production":"nextjs-payload","sveltekit-production":"sveltekit-payload","nuxt-production":"nuxt-payload"}')[matrix.target] }}
        run: bash scripts/ci-install-fixture.sh "examples/$EXAMPLE"
      - run: bash scripts/ci-install-fixture.sh examples/payload-backend
      - env:
          PLP_REAL_PAYLOAD_TARGET: ${{ matrix.target }}
          PLP_REAL_PAYLOAD_BROWSERS: ${{ matrix.browser }}
        run: npm run test:e2e:real-payload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-real-payload-${{ matrix.target }}-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  # Payload's CSRF list on: a cookie that arrives without an Origin header is refused, which is how a
  # preview site's server forwards the editor's session. The package repeats the admin's origin
  # (docs/authorization.md); the target that verifies the session and the one that merges as the
  # editor run once more with the list to show that it does.
  real-payload-csrf:
    name: Real Payload E2E (${{ matrix.target }}, CSRF list)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [nextjs, nextjs-hook]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Payload 3.92 needs ^22.23.4, and a bare 22 resolved to 22.23.3 on the runners (2026-10-25)
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/*/package-lock.json
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: bash scripts/ci-install-browser.sh chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ github.sha }}
          path: dist
      - run: bash scripts/ci-install-fixture.sh examples/nextjs-payload
      - run: bash scripts/ci-install-fixture.sh examples/payload-backend
      - env:
          PLP_REAL_PAYLOAD_TARGET: ${{ matrix.target }}
          PLP_REAL_PAYLOAD_CSRF: '1'
        run: npm run test:e2e:real-payload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-real-payload-csrf-${{ matrix.target }}
          path: playwright-report/
          retention-days: 7

  release-gates:
    name: Release Gates
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/2.0')
    needs: build
    uses: ./.github/workflows/critical-gates.yml
    permissions:
      contents: read
    with:
      dist-artifact: dist-${{ github.sha }}
      soak-duration-ms: '300000'
