name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Main runs carry the verdict the Release workflow consumes; never cancel them.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      # The generated runtime is a build output, so every check that imports
      # or type-checks it needs it generated first.
      - run: npm run build:runtime
      - run: npm run audit:gate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:policy
      - run: npm run test:architecture
      - run: npm run compat:check

  unit:
    name: Unit Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The pinned npm exists for reproducible packaging, and that is enforced
      # on the pinned Node elsewhere. Here the point is the opposite: does the
      # package work on each Node it claims? npm 12 needs Node 22.22+, so the
      # oldest supported Node keeps its bundled npm — which is also the npm a
      # consumer on that version actually has. Only an engine mismatch falls
      # back; any other install failure still fails the job.
      - name: Use the repository npm version where this Node supports it
        run: node scripts/use-repository-npm.mjs
      - run: npm ci
      - run: npm run build:runtime
      - run: npm run test:unit
      - run: npm run test:integration

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Diff coverage is computed against the reviewed base commit.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm run build:runtime
      - run: npm run test:coverage
      - name: Enforce changed-line coverage and threshold ratchets
        env:
          COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run test:coverage:diff
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  mutation:
    name: PR Critical Mutation Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm run build:runtime
      - name: Prove critical assertions kill injected faults
        env:
          STRYKER_SCOPE: pr
        run: npm run test:mutation
      - name: Enforce exact zero-error PR mutation baseline
        run: npm run test:mutation:policy:pr
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutation-report-pr
          path: |
            test-results/stryker-pr.json
            test-results/stryker-pr.html
          if-no-files-found: ignore
          retention-days: 7

  fixture-audit:
    name: Fixture Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      # Lockfile-only audits: the advisories are a property of the reviewed
      # lockfiles, not of an installed tree.
      - run: npm audit --audit-level=high --package-lock-only --prefix examples/astro-payload
      - run: npm audit --audit-level=high --package-lock-only --prefix examples/nextjs-payload
      - run: npm audit --audit-level=high --package-lock-only --prefix examples/sveltekit-payload
      - run: npm audit --audit-level=high --package-lock-only --prefix examples/nuxt-payload
      - run: npm audit --audit-level=high --package-lock-only --prefix examples/astro-hybrid
      - run: npm audit --audit-level=high --package-lock-only --prefix examples/pure-html
      - run: npm audit --audit-level=high --package-lock-only --prefix examples/vanilla-client
      - run: npm audit --audit-level=high --package-lock-only --prefix examples/astro-inline
      - run: npm audit --audit-level=high --package-lock-only --prefix examples/astro-middleware
      - run: npm audit --audit-level=high --package-lock-only --prefix examples/payload-backend

  build:
    name: Build
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/*/package-lock.json
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ github.sha }}
          path: dist
      # Every fixture installs the freshly built package from its immutable
      # lockfile (`file:../..`, kept in sync by the version script).
      - run: npm ci --no-audit --no-fund --prefix examples/astro-payload
      - run: npm ci --no-audit --no-fund --prefix examples/nextjs-payload
      - run: npm ci --no-audit --no-fund --prefix examples/sveltekit-payload
      - run: npm ci --no-audit --no-fund --prefix examples/nuxt-payload
      - run: npm ci --no-audit --no-fund --prefix examples/astro-hybrid
      - run: npm ci --no-audit --no-fund --prefix examples/pure-html
      - run: npm ci --no-audit --no-fund --prefix examples/vanilla-client
      - run: npm ci --no-audit --no-fund --prefix examples/astro-inline
      - run: npm ci --no-audit --no-fund --prefix examples/astro-middleware
      - run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  astro-matrix:
    name: Astro matrix (Astro ${{ matrix.astro }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        astro: [6, 5, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/*/package-lock.json
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ github.sha }}
          path: dist
      # The install mutates the fixture manifest in this checkout only; the
      # resolved version is printed so the log states what was tested.
      - run: npm --prefix examples/astro-payload install --no-audit --no-fund --dangerously-allow-all-scripts "astro@^${{ matrix.astro }}"
      - run: node -p "'astro ' + require('./examples/astro-payload/node_modules/astro/package.json').version"
      - env:
          PLP_E2E_SERVERS: astro
        run: >-
          npx playwright test --project=chromium
          tests/e2e/specs/accessibility.spec.ts
          tests/e2e/specs/diagnostics.spec.ts
          tests/e2e/specs/island-bridge.spec.ts
          tests/e2e/specs/live-preview.spec.ts
          tests/e2e/specs/navigation-lifecycle.spec.ts
          tests/e2e/specs/root-replacement.spec.ts
          tests/e2e/specs/scenarios.spec.ts
          tests/e2e/specs/structural-morph.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-astro-${{ matrix.astro }}
          path: playwright-report/
          retention-days: 7

  real-payload-e2e:
    name: Real Payload E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/*/package-lock.json
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ github.sha }}
          path: dist
      - run: npm ci --no-audit --no-fund --prefix examples/astro-payload
      - run: npm ci --no-audit --no-fund --prefix examples/payload-backend
      - run: npm run test:e2e:real-payload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-real-payload
          path: playwright-report/
          retention-days: 7

  real-payload-hybrid:
    name: Real Payload E2E (hybrid, ${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/*/package-lock.json
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ github.sha }}
          path: dist
      - run: npm ci --no-audit --no-fund --prefix examples/astro-hybrid
      - run: npm ci --no-audit --no-fund --prefix examples/payload-backend
      - env:
          PLP_REAL_PAYLOAD_TARGET: hybrid
          PLP_REAL_PAYLOAD_BROWSERS: ${{ matrix.browser }}
        run: npm run test:e2e:real-payload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-real-payload-hybrid-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  release-gates:
    name: Release Gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    uses: ./.github/workflows/critical-gates.yml
    permissions:
      contents: read
    with:
      dist-artifact: dist-${{ github.sha }}
      soak-duration-ms: '300000'
