name: Protocol Watch

# This library hand-mirrors Payload's live-preview postMessage protocol
# (no `payload` dependency by design). This nightly job downloads the
# @payloadcms/live-preview client, reads the admin that talks to it, and
# drives a real admin against the fixture frontend, so protocol drift
# surfaces as a red run instead of silent breakage in consumer projects.
#
# Nightly rather than weekly since Z13: canary moves daily, and the point of
# the canary row is to hear about Payload 4 before it ships, not six days after.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# The watch installs a published package and compares its wire shape; it writes
# nothing to the repository. `issues: write` is for the one thing a red cron job
# cannot do on its own — say so somewhere a person will look.
permissions:
  contents: read
  issues: write

jobs:
  protocol-watch:
    name: Wire-format invariants (${{ matrix.dist-tag }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # latest is the gate: drift here = broken for real users NOW.
          - dist-tag: latest
            soft-fail: false
          # canary (e.g. Payload 4.0 pre-releases) is an early-warning
          # signal, not a gate — pre-release protocols may legitimately
          # churn before stabilising.
          - dist-tag: canary
            soft-fail: true
    continue-on-error: ${{ matrix.soft-fail }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      # Executes their receiver AND reads their sender: the message object the
      # admin builds, against tests/fixtures/protocol-model.ts.
      - run: npx tsx scripts/check-protocol-drift.ts
        env:
          PROTOCOL_WATCH_PACKAGE: '@payloadcms/live-preview@${{ matrix.dist-tag }}'
      # Only for the gate matrix entry: `canary` churns before it stabilises,
      # and an issue per pre-release would train everyone to ignore the label.
      - name: File the drift as an issue
        if: failure() && matrix.dist-tag == 'latest'
        run: npx tsx scripts/report-protocol-drift.ts
        env:
          GH_TOKEN: ${{ github.token }}
      # Last, and deliberately after the issue step: this one re-runs the
      # behaviours docs/react.md compares against on the published dist. A red
      # run means one of them was fixed upstream — news for the docs, not drift
      # to file an issue about.
      - run: npm run test:upstream-findings
        env:
          UPSTREAM_FINDINGS_PACKAGE: '@payloadcms/live-preview@${{ matrix.dist-tag }}'

  admin-e2e:
    name: Real admin E2E (${{ matrix.dist-tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - dist-tag: latest
            soft-fail: false
            node: 22
          # canary is a major (Payload 4) and may not even boot this fixture;
          # a red run here is news, not a broken build. It needs its own Node:
          # payload@4 and @payloadcms/next@4 declare `node >=24.15.0`, so on 22
          # the row could never boot the admin whatever else was fixed.
          - dist-tag: canary
            soft-fail: true
            node: 24
    continue-on-error: ${{ matrix.soft-fail }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/*/package-lock.json
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # No build job to download from in a scheduled workflow, so the artefact
      # the fixtures inject is built here.
      - run: npm run build
      - run: npm ci --no-audit --no-fund --prefix examples/astro-payload
      # The install mutates the fixture manifest in this checkout only; the
      # resolved version is printed so the log states what was tested.
      # `--no-package-lock`: the fixture lockfile pins the whole @payloadcms tree,
      # including transitive packages this line does not name, and their peers are
      # exact. Resolving against it makes any Payload release after the pinned one
      # an ERESOLVE before a single assertion runs — which is what happened on
      # 2026-09-12 for both rows. The watch tests a foreign version on purpose.
      - run: npm --prefix examples/payload-backend install --no-audit --no-fund --no-package-lock --dangerously-allow-all-scripts "payload@${{ matrix.dist-tag }}" "@payloadcms/next@${{ matrix.dist-tag }}" "@payloadcms/db-sqlite@${{ matrix.dist-tag }}" "@payloadcms/richtext-lexical@${{ matrix.dist-tag }}"
      - run: node -p "'payload ' + require('./examples/payload-backend/node_modules/payload/package.json').version"
      # The recorder runs as an assertion, not as a recorder: it fails if the
      # session no longer crosses a save, and CI cannot commit what it captures.
      # Re-recording stays a maintainer step (`PLP_RECORD_CORPUS=1`).
      - run: npm run test:e2e:real-payload
      # The admin half never writes a drift report: it fails before any
      # invariant runs when the install or the boot goes wrong, and that is
      # exactly as invisible as drift. Same gate entry, same issue, and the
      # fallback is asked for by name so no unrelated red step files one.
      - name: File the failed admin run as an issue
        if: failure() && matrix.dist-tag == 'latest'
        run: npx tsx scripts/report-protocol-drift.ts
        env:
          GH_TOKEN: ${{ github.token }}
          PROTOCOL_WATCH_PACKAGE: 'payload@${{ matrix.dist-tag }}'
          PROTOCOL_WATCH_FALLBACK: 'the real admin E2E job failed before its assertions; read the run log'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-admin-${{ matrix.dist-tag }}
          path: playwright-report/
          retention-days: 7
