name: Performance Trends

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # CodSpeed authenticates uploads through GitHub OIDC. Public forks can use
  # CodSpeed's tokenless validation path without repository secrets.
  id-token: write

jobs:
  cpu:
    name: CodSpeed CPU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm run build:runtime
      - name: Validate deterministic CPU benchmark harness
        run: npm run test:bench:codspeed
        shell: bash
      - name: Record deterministic CPU trends
        # Keep the benchmark itself required before CodSpeed repository onboarding.
        # Once the GitHub App is installed, set CODSPEED_REQUIRED=true so action
        # execution, authentication, and upload are fail-closed.
        continue-on-error: ${{ vars.CODSPEED_REQUIRED != 'true' }}
        uses: CodSpeedHQ/action@f22792bfac16f3e14eb9fbea76f4a48e9cc22b93 # v4.19.1
        with:
          mode: simulation
          run: npm run test:bench:codspeed

  memory:
    name: CodSpeed Allocations
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm run build:runtime
      - name: Record allocation trends
        continue-on-error: ${{ vars.CODSPEED_REQUIRED != 'true' }}
        uses: CodSpeedHQ/action@f22792bfac16f3e14eb9fbea76f4a48e9cc22b93 # v4.19.1
        with:
          mode: memory
          run: npm run test:bench:codspeed
