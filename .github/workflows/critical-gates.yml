name: Critical Gates

# The release-critical baseline: the complete mutation scope, the 10,000-cycle
# Node leak gate and the Chromium soak. One definition, called from CI on
# every push to main and from Deep Quality on its schedule.
on:
  workflow_call:
    inputs:
      dist-artifact:
        description: Name of the `dist/` artifact produced by build.yml.
        required: true
        type: string
      soak-duration-ms:
        description: Browser soak duration in milliseconds.
        required: false
        type: string
        default: '300000'

permissions:
  contents: read

jobs:
  critical-mutation:
    name: Release Critical Mutation Shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    # One sixth of a scope that runs ~250 min whole on these runners, packed by
    # measured test time. Earlier splits ran worse: three packed by file size,
    # then five packed by test count, which hid 25 % of the time in a 20 % shard.
    #
    # Balanced weights are not balanced minutes. Shards carrying an equal modelled
    # share still measured 22 to 55 minutes in one run, because a mutant that times
    # out costs the full timeoutMS whatever its tests normally cost, and a loaded
    # runner produces more of them. Pricing timeouts into the weights was tried and
    # did not predict wall time any better. So the cap carries headroom instead.
    # Two runs of the 2.1 scope measured 79, 82, 89, 101, 129 and 137 minutes
    # (ae95f71) and 63, 65, 83, 104, 127 and 127 (e03f369): the same shard took 79
    # minutes in one run and 127 in the other, and 137 left 9 % of a 150-minute cap.
    # The cap is 180, a third above the slowest.
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm run build:runtime
      - name: Mutate this shard of the release-critical runtime scope
        env:
          STRYKER_SCOPE: nightly
          STRYKER_SHARD: ${{ matrix.shard }}/6
        run: npm run test:mutation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: critical-mutation-shard-${{ matrix.shard }}-${{ github.sha }}
          path: |
            test-results/stryker-nightly-shard${{ matrix.shard }}.json
            test-results/stryker-nightly-shard${{ matrix.shard }}.html
          if-no-files-found: error
          retention-days: 14

  trusted-core-mutation:
    name: Trusted Core Mutation
    runs-on: ubuntu-latest
    # Nine modules and 2,080 mutants: 29 minutes on a development host with four
    # workers, 85 minutes on this runner in the run for e03f369 and more than 90
    # in the run for ae95f71, which the former 90-minute cap cancelled. The cap is
    # 150, two thirds above the 90 it is known to need. The scope is graded against
    # a policy the nightly one cannot stand in for: the nightly report is one score
    # over sixty-odd files, while this one demands 98.94 % and an `equivalent` entry
    # for every survivor by name. That is the check that would have caught the
    # registry name no test held in 2.0.3.
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm run build:runtime
      - name: Mutate the trusted core on its own
        env:
          STRYKER_SCOPE: core
        run: npm run test:mutation
      - name: Enforce the reviewed trusted-core baseline
        run: npm run test:mutation:policy:core
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trusted-core-mutation-report-${{ github.sha }}
          path: |
            test-results/stryker-core.json
            test-results/stryker-core.html
          if-no-files-found: error
          retention-days: 14

  critical-mutation-baseline:
    name: Release Critical Mutation Baseline
    needs: critical-mutation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: critical-mutation-shard-*-${{ github.sha }}
          path: test-results
          merge-multiple: 'true'
      # The policy grades one report, so how the work was divided cannot change
      # the verdict: the merge refuses shards from different configurations and
      # refuses a file two shards both claim to have mutated.
      - name: Join the shard reports into one baseline report
        run: >-
          npx tsx scripts/merge-mutation-reports.ts
          --out test-results/stryker-nightly.json
          test-results/stryker-nightly-shard1.json
          test-results/stryker-nightly-shard2.json
          test-results/stryker-nightly-shard3.json
          test-results/stryker-nightly-shard4.json
          test-results/stryker-nightly-shard5.json
          test-results/stryker-nightly-shard6.json
      - name: Enforce the reviewed critical mutation baseline
        run: npm run test:mutation:policy
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: critical-mutation-report-${{ github.sha }}
          path: test-results/stryker-nightly.json
          if-no-files-found: ignore
          retention-days: 14

  node-leak-soak:
    name: Release Node Lifecycle Leak Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm run build:runtime
      - name: Prove 10,000 lifecycle cycles release owned resources
        run: npm run test:leak

  browser-soak:
    name: Release Chromium Update & Heap Soak
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # The soak serves the Astro fixture, and Astro 7.4.2 needs >=22.23.4 (2026-10-27)
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/*/package-lock.json
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: bash scripts/ci-install-browser.sh chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.dist-artifact }}
          path: dist
      - run: bash scripts/ci-install-fixture.sh examples/astro-payload
      - name: Exercise sustained browser updates against the built runtime
        env:
          PLP_SOAK_DURATION_MS: ${{ inputs.soak-duration-ms }}
        run: npm run test:soak
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-soak-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/soak-results.json
          if-no-files-found: ignore
          retention-days: 14
