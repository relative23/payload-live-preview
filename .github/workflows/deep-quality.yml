name: Deep Quality

on:
  schedule:
    # Five-minute browser soak Monday-Saturday; thirty minutes on Sunday.
    - cron: '17 2 * * 1-6'
    - cron: '17 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation-and-properties:
    name: Full Mutation & Property Exploration
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm run build:runtime
      - name: Explore deterministic property corpus
        env:
          PLP_PROPERTY_SEED: ${{ github.run_id }}
          PLP_PROPERTY_RUNS: 10000
        run: |
          echo "PLP_PROPERTY_SEED=$PLP_PROPERTY_SEED"
          mkdir -p test-results
          # Captured to a file and echoed afterwards, not piped through tee:
          # the pinned command must stay on its own line, and a plain
          # redirection cannot lose the tail to a flush race the way process
          # substitution can. Without this a failure reaches the reader as
          # "Process completed with exit code 1" and nothing else — the run
          # that failed on 2026-08-26 left no counterexample, no property
          # name, and its logs expired before they could be read.
          status=0
          {
            npm run test:property
          } >test-results/property-exploration.log 2>&1 || status=$?
          cat test-results/property-exploration.log
          exit "$status"
      - name: Mutate the complete critical runtime scope
        env:
          STRYKER_SCOPE: nightly
        run: npm run test:mutation
      - name: Enforce reviewed mutation baseline
        run: npm run test:mutation:policy
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutation-report-nightly
          path: |
            test-results/stryker-nightly.json
            test-results/stryker-nightly.html
            test-results/property-exploration.log
          if-no-files-found: ignore
          retention-days: 14

  node-leak-soak:
    name: Node Lifecycle Leak Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm run build:runtime
      - name: Prove 10,000 lifecycle cycles release owned resources
        run: npm run test:leak

  browser-soak:
    name: Chromium Update & Heap Soak
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm ci --no-audit --no-fund --prefix examples/astro-payload
      - run: npm audit --audit-level=high --prefix examples/astro-payload
      - name: Exercise the built runtime under sustained browser updates
        env:
          PLP_SOAK_DURATION_MS: ${{ github.event.schedule == '17 2 * * 0' && '1800000' || '300000' }}
        run: npm run test:soak
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-soak-report
          path: |
            playwright-report/
            test-results/soak-results.json
          if-no-files-found: ignore
          retention-days: 14
