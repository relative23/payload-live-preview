name: Deep Quality

on:
  schedule:
    # Five-minute browser soak Monday-Saturday; thirty minutes on Sunday.
    - cron: '17 2 * * 1-6'
    - cron: '17 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  property-exploration:
    name: Property Exploration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm run build:runtime
      - name: Explore deterministic property corpus
        env:
          PLP_PROPERTY_SEED: ${{ github.run_id }}
          PLP_PROPERTY_RUNS: 10000
        # Captured to a file and echoed afterwards: a pipe through tee can lose
        # the counterexample at the tail of a failing run.
        run: |
          echo "PLP_PROPERTY_SEED=$PLP_PROPERTY_SEED"
          mkdir -p test-results
          status=0
          {
            npm run test:property
          } >test-results/property-exploration.log 2>&1 || status=$?
          cat test-results/property-exploration.log
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: property-exploration-log
          path: test-results/property-exploration.log
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  critical-gates:
    name: Critical Gates
    needs: build
    uses: ./.github/workflows/critical-gates.yml
    permissions:
      contents: read
    with:
      dist-artifact: dist-${{ github.sha }}
      soak-duration-ms: ${{ github.event.schedule == '17 2 * * 0' && '1800000' || '300000' }}

  browser-bench:
    name: Chromium Update-to-Paint Trend
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/*/package-lock.json
      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ github.sha }}
          path: dist
      - run: npm ci --no-audit --no-fund --prefix examples/astro-payload
      # A trend, not a gate: timing on a shared runner is noise. The spec fails
      # only when a measurement could not be taken.
      - name: Measure update-to-paint on the 300 / 1,000 / 5,000-binding scenarios
        run: npm run test:browser-bench
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-bench-report
          path: |
            test-results/browser-bench.json
            test-results/browser-bench-results.json
            playwright-report/
          if-no-files-found: ignore
          retention-days: 90
