name: Release

# A successful CI push run on a release branch certifies its head commit;
# this workflow either opens the Version PR or publishes the exact artifact that
# run produced. The branches are listed once, in scripts/release-gate.ts.
# `workflow_dispatch` re-enters an infrastructure-interrupted certified run
# while its source branch still names the certified commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Id of a successful CI push run on main or release/1.x or release/2.0 to release.
        required: true
        type: string

# One release at a time per branch, so independent release branches never wait
# on each other. A source dispatch queues behind its branch's router.
concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    name: Decide release action
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' ||
      github.event.workflow_run.head_branch == 'release/1.x' ||
      github.event.workflow_run.head_branch == 'release/2.0') &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.release_gate.outputs.run_id }}
      tested_sha: ${{ steps.release_gate.outputs.tested_sha }}
      tested_branch: ${{ steps.release_gate.outputs.tested_branch }}
      version_pr: ${{ steps.release_gate.outputs.version_pr }}
      publish: ${{ steps.release_gate.outputs.publish }}
    steps:
      # workflow_run uses the default branch; a dispatch uses its selected branch.
      # Both certify the requested CI run and read its tested commit through Git.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - run: npm ci

      - name: Decide whether to version or publish
        id: release_gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: npx tsx scripts/release-gate.ts

      # A dispatch runs the source branch's workflow, whose signed identity must
      # agree with the CI run just certified. A moved branch fails before publish.
      - name: Verify dispatched source snapshot
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TESTED_SHA: ${{ steps.release_gate.outputs.tested_sha }}
          TESTED_BRANCH: ${{ steps.release_gate.outputs.tested_branch }}
        run: |
          if [ "$GITHUB_SHA" != "$TESTED_SHA" ] ||
             [ "$GITHUB_REF" != "refs/heads/$TESTED_BRANCH" ] ||
             [ "$GITHUB_WORKFLOW_SHA" != "$TESTED_SHA" ] ||
             [ "$GITHUB_WORKFLOW_REF" != "$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/$TESTED_BRANCH" ]; then
            echo "dispatched workflow source differs from certified CI"
            exit 1
          fi

  version:
    name: Create or update Version PR
    needs: gate
    # changesets/action resets its version branch to github.sha, which under
    # workflow_run is the tip of main; the runner writes GITHUB_SHA over any
    # step env. The Version PR is only correct when the tested commit is still
    # that tip, so maintenance branches are versioned by hand and the gate says so.
    if: >-
      needs.gate.outputs.version_pr == 'true' &&
      needs.gate.outputs.tested_sha == github.sha
    runs-on: ubuntu-latest
    permissions:
      # actions: read is for the jobs of the CI run that compat:record reads.
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.tested_sha }}
          fetch-depth: 0

      - name: Verify tested commit
        env:
          TESTED_SHA: ${{ needs.gate.outputs.tested_sha }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - run: npm ci

      # The CI run this Version PR releases becomes the result of the compatibility rows it ran.
      # changesets/action commits the record with the version, so it moves with each release and
      # nothing between releases writes to the repository.
      - name: Record the released CI run as the compatibility result
        run: npm run compat:record
        env:
          GH_TOKEN: ${{ github.token }}
          PLP_CI_RUN_ID: ${{ needs.gate.outputs.run_id }}

      - name: Create Version PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: npm run version
          commit: 'chore: release'
          title: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  source-dispatch:
    name: Route publication to certified source workflow
    needs: gate
    # workflow_run signs the default-branch snapshot. Dispatch the certified
    # branch instead; the receiver refuses drift and never dispatches recursively.
    if: >-
      github.event_name == 'workflow_run' &&
      needs.gate.outputs.publish == 'true' &&
      (github.sha != needs.gate.outputs.tested_sha ||
      github.ref != format('refs/heads/{0}', needs.gate.outputs.tested_branch) ||
      github.workflow_sha != needs.gate.outputs.tested_sha ||
      github.workflow_ref != format('{0}/.github/workflows/release.yml@refs/heads/{1}', github.repository, needs.gate.outputs.tested_branch))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch certified source workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ needs.gate.outputs.tested_sha }}
          TESTED_BRANCH: ${{ needs.gate.outputs.tested_branch }}
          TESTED_RUN_ID: ${{ needs.gate.outputs.run_id }}
        run: |
          case "$TESTED_BRANCH" in
            main|release/1.x|release/2.0) ;;
            *) echo "invalid certified release branch"; exit 1 ;;
          esac
          if ! [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             ! [[ "$TESTED_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "invalid certified commit or CI run id"
            exit 1
          fi
          if ! [[ "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [ "$GITHUB_WORKFLOW_REF" != "$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" ]; then
            echo "invalid actual release workflow identity"
            exit 1
          fi
          actual_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TESTED_BRANCH" --jq '.object.sha')"
          if [ "$actual_head" != "$TESTED_SHA" ]; then
            echo "certified branch moved; refusing source dispatch"
            exit 1
          fi
          router_workflow="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/release.yml?ref=$GITHUB_WORKFLOW_SHA" --jq '.sha')"
          source_workflow="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/release.yml?ref=$TESTED_SHA" --jq '.sha')"
          if ! [[ "$router_workflow" =~ ^[0-9a-f]{40}$ ]] ||
             [ "$source_workflow" != "$router_workflow" ]; then
            echo "source receiver workflow differs; backport the guarded workflow and certify CI again"
            exit 1
          fi
          jq -n --arg ref "$TESTED_BRANCH" --arg run_id "$TESTED_RUN_ID" \
            '{ref:$ref, inputs:{run_id:$run_id}}' > "$RUNNER_TEMP/source-dispatch.json"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" \
            --input "$RUNNER_TEMP/source-dispatch.json"
          # The receiver shares this branch's concurrency key and starts after
          # this router exits. Waiting here would prevent the receiver starting.

  publish:
    name: Publish verified version
    needs: gate
    # Only the actual certified source workflow may acquire an OIDC publisher.
    if: >-
      needs.gate.outputs.publish == 'true' &&
      github.sha == needs.gate.outputs.tested_sha &&
      github.ref == format('refs/heads/{0}', needs.gate.outputs.tested_branch) &&
      github.workflow_sha == needs.gate.outputs.tested_sha &&
      github.workflow_ref == format('{0}/.github/workflows/release.yml@refs/heads/{1}', github.repository, needs.gate.outputs.tested_branch)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.tested_sha }}
          fetch-depth: 0

      - name: Verify tested commit
        env:
          TESTED_SHA: ${{ needs.gate.outputs.tested_sha }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - run: npm ci

      - name: Derive reproducible source date from the tested commit
        id: source_date
        env:
          TESTED_SHA: ${{ needs.gate.outputs.tested_sha }}
        run: |
          epoch=$(git show -s --format=%ct "$TESTED_SHA")
          case "$epoch" in
            ''|*[!0-9]*) echo "invalid commit timestamp"; exit 1 ;;
          esac
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"

      # Artifacts v4 are immutable; run-id plus the commit-bound name selects
      # exactly the package the certified run produced.
      - name: Download exact CI package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ needs.gate.outputs.tested_sha }}
          path: release-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.gate.outputs.run_id }}

      - name: Recheck downloaded archive without repacking the repository
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
          TESTED_SHA: ${{ needs.gate.outputs.tested_sha }}
        shell: bash
        run: |
          shopt -s nullglob
          tarballs=(release-artifact/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "expected exactly one CI package archive"
            exit 1
          fi
          npm run test:package -- --tarball "${tarballs[0]}" --source-commit "$TESTED_SHA"

      # Sends the checked tgz to npm with scripts disabled, under the dist-tag
      # the version and the registry's `latest` decide, then downloads it from
      # the registry and compares digests and inventory before creating the
      # local release tag.
      # The runner identity is signed by GitHub. Check it again in the actual
      # publish shell without replacing source variables for the npm process.
      - name: Publish with provenance
        id: publish
        shell: bash
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          PACKAGE_ARTIFACT_DIR: release-artifact
          PACKAGE_SOURCE_COMMIT: ${{ needs.gate.outputs.tested_sha }}
          PACKAGE_SOURCE_BRANCH: ${{ needs.gate.outputs.tested_branch }}
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
        run: |
          if [ "$GITHUB_SHA" != "$PACKAGE_SOURCE_COMMIT" ] ||
             [ "$GITHUB_REF" != "refs/heads/$PACKAGE_SOURCE_BRANCH" ] ||
             [ "$GITHUB_WORKFLOW_SHA" != "$PACKAGE_SOURCE_COMMIT" ] ||
             [ "$GITHUB_WORKFLOW_REF" != "$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/$PACKAGE_SOURCE_BRANCH" ]; then
            echo "publisher workflow source differs from certified CI"
            exit 1
          fi
          npm run release

      # The Release follows npm: a version not published under `latest` does
      # not take GitHub's Latest label.
      - name: Push the release tag and create the GitHub Release
        env:
          DIST_TAG: ${{ steps.publish.outputs.dist_tag }}
          GH_TOKEN: ${{ github.token }}
          PACKAGE_SOURCE_COMMIT: ${{ needs.gate.outputs.tested_sha }}
        run: npx tsx scripts/github-release.ts

      # Installs what the registry actually serves, in a directory with no
      # workspace, lockfile or local dist, and imports every Node-reachable
      # subpath. It cannot prevent the publish; it makes a broken one loud.
      - name: Smoke-test the published package from the registry
        run: npm run test:smoke
