name: Release

on:
  # CI contains lint/policy/architecture, unit/matrix, critical coverage, the
  # complete release mutation baseline, the 10k Node leak gate, a five-minute
  # Chromium soak, browser E2E, real-Payload E2E, build, and exact-package gates.
  # A successful conclusion therefore certifies all of them for head_sha.
  workflow_run:
    workflows: [CI]
    types: [completed]

# Main release state mutations are serialized, and a newer push must never
# interrupt a running publish.
concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

# The workflow-level token starts with no access. Each job below requests only
# the subset needed for its own release phase.
permissions: {}

jobs:
  gate:
    name: Decide release action
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version_pr: ${{ steps.release_gate.outputs.version_pr }}
      publish: ${{ steps.release_gate.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify tested commit
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      # A changeset opens/updates the Version PR. Once that PR is merged there
      # are no pending changesets, and an unpublished package version is the
      # only state allowed to reach the registry.
      - name: Decide whether to version or publish
        id: release_gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          changesets=false
          for changeset in .changeset/*.md; do
            if [ -f "$changeset" ] && [ "$changeset" != ".changeset/README.md" ]; then
              changesets=true
              break
            fi
          done

          # A registry outage is not evidence that a version is unpublished.
          # Fail closed unless npm explicitly reports a missing package/version.
          #
          # stderr is captured to its own file rather than merged into the
          # result. npm writes config warnings there, and folding them into
          # $published made it unequal to $version for reasons that have
          # nothing to do with the registry, which flips the comparison below
          # to "not published" and asks the publisher to release over an
          # existing version.
          registry_stderr=$(mktemp)
          set +e
          registry_result=$(npm view "$name@$version" version 2>"$registry_stderr")
          registry_status=$?
          set -e
          if [ "$registry_status" -eq 0 ]; then
            published=$(printf '%s\n' "$registry_result" | grep -v '^[[:space:]]*$' | tail -n 1 | tr -d '[:space:]')
          elif grep -q 'E404' "$registry_stderr"; then
            published=
          else
            echo "npm registry lookup failed; refusing to infer an unpublished version"
            cat "$registry_stderr"
            exit "$registry_status"
          fi

          version_pr=false
          publish=false
          if [ "$changesets" = "true" ]; then
            version_pr=true
          elif [ "$published" != "$version" ]; then
            publish=true
          else
            # A package may have reached npm before tag/release creation failed.
            # Re-enter the exact-artifact publisher only to reconcile that state.
            tag="v$version"
            tagged=false
            tagged_sha=
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              tagged_sha=$(git rev-list -n 1 "$tag")
              tagged=true
            fi

            # Same reason as the npm lookup above: stderr stays out of the
            # value that gets compared against "$tag".
            release_stderr=$(mktemp)
            set +e
            release_result=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .tag_name 2>"$release_stderr")
            release_status=$?
            set -e
            if [ "$release_status" -eq 0 ]; then
              release_result=$(printf '%s\n' "$release_result" | grep -v '^[[:space:]]*$' | tail -n 1 | tr -d '[:space:]')
              if [ "$release_result" != "$tag" ]; then
                echo "GitHub returned an unexpected release tag: $release_result"
                exit 1
              fi
              released=true
            elif grep -q 'HTTP 404' "$release_stderr"; then
              released=false
            else
              echo "GitHub release lookup failed; refusing to infer missing release state"
              cat "$release_stderr"
              exit "$release_status"
            fi

            if [ "$released" = "true" ]; then
              if [ "$tagged" != "true" ]; then
                echo "GitHub Release $tag exists without a fetched Git tag; refusing inconsistent state"
                exit 1
              fi
              # A later docs-only commit normally retains the already-published
              # package version. Its complete historical release is a no-op;
              # the tag is expected to point to the earlier release commit.
              publish=false
            elif [ "$tagged" = "true" ] && [ "$tagged_sha" != "$TESTED_SHA" ]; then
              echo "$tag has no GitHub Release and points to $tagged_sha, not tested commit $TESTED_SHA"
              echo "rerun the original release commit to reconcile its certified artifact"
              exit 1
            else
              publish=true
            fi
          fi

          echo "version_pr=$version_pr" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "changesets=$changesets published=${published:-none} version=$version version_pr=$version_pr publish_or_reconcile=$publish"

  version:
    name: Create or update Version PR
    needs: gate
    if: >-
      needs.gate.outputs.version_pr == 'true' &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify tested commit
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - run: npm ci

      - name: Create Version PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          # The action does not publish while changesets are present; this
          # input makes the generated PR accurately describe the post-merge
          # publish phase handled by the separate least-privilege job below.
          publish: npm run release
          version: npm run version
          commit: 'chore: release'
          title: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish verified version
    needs: gate
    if: >-
      needs.gate.outputs.publish == 'true' &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify tested commit
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - run: npm ci

      - name: Derive reproducible source date from the tested commit
        id: source_date
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          epoch=$(git show -s --format=%ct "$TESTED_SHA")
          case "$epoch" in
            ''|*[!0-9]*) echo "invalid commit timestamp"; exit 1 ;;
          esac
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"

      # Artifacts v4 are immutable. Supplying both run-id and the commit-bound
      # name prevents this privileged workflow_run job from selecting a package
      # produced by another workflow execution.
      - name: Download exact CI package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ github.event.workflow_run.head_sha }}
          path: release-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Recheck downloaded archive without repacking the repository
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          shopt -s nullglob
          tarballs=(release-artifact/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "expected exactly one CI package archive"
            exit 1
          fi
          npm run test:package -- --tarball "${tarballs[0]}" --source-commit "$TESTED_SHA"

      # The custom publish script sends the already-checked tgz directly to npm
      # with scripts disabled, then downloads it from the registry and compares
      # SHA-256/SHA-512 plus the complete inventory. Only after that proof does
      # it emit Changesets' New-tag signal; the pinned action pushes the tag and
      # creates (or reconciles) the GitHub Release from CHANGELOG.md.
      - name: Publish with provenance
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          publish: npm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          PACKAGE_ARTIFACT_DIR: release-artifact
          PACKAGE_SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
