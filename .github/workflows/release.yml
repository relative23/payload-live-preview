name: Release

# A successful CI run on main certifies its head commit; this workflow either
# opens the Version PR or publishes the exact artifact that run produced.
# `workflow_dispatch` re-enters a certified run whose release was skipped
# (for example because a newer push landed while its CI was still running).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Id of a successful CI push run on main to release.
        required: true
        type: string

concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    name: Decide release action
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.release_gate.outputs.run_id }}
      tested_sha: ${{ steps.release_gate.outputs.tested_sha }}
      version_pr: ${{ steps.release_gate.outputs.version_pr }}
      publish: ${{ steps.release_gate.outputs.publish }}
    steps:
      # The gate itself runs from the current main tip; the tested commit is
      # read through Git so a re-entered run still gets today's gate logic.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - run: npm ci

      - name: Decide whether to version or publish
        id: release_gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: npx tsx scripts/release-gate.ts

  version:
    name: Create or update Version PR
    needs: gate
    # changesets/action branches from github.sha, so the Version PR is only
    # correct when the tested commit is still the tip of main.
    if: >-
      needs.gate.outputs.version_pr == 'true' &&
      needs.gate.outputs.tested_sha == github.sha
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.tested_sha }}
          fetch-depth: 0

      - name: Verify tested commit
        env:
          TESTED_SHA: ${{ needs.gate.outputs.tested_sha }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - run: npm ci

      - name: Create Version PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: npm run version
          commit: 'chore: release'
          title: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish verified version
    needs: gate
    # The gate has proven the tested commit is on main and its version is
    # still unpublished; a newer push to main must not block this artifact.
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.tested_sha }}
          fetch-depth: 0

      - name: Verify tested commit
        env:
          TESTED_SHA: ${{ needs.gate.outputs.tested_sha }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Use repository npm version
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - run: npm ci

      - name: Derive reproducible source date from the tested commit
        id: source_date
        env:
          TESTED_SHA: ${{ needs.gate.outputs.tested_sha }}
        run: |
          epoch=$(git show -s --format=%ct "$TESTED_SHA")
          case "$epoch" in
            ''|*[!0-9]*) echo "invalid commit timestamp"; exit 1 ;;
          esac
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"

      # Artifacts v4 are immutable; run-id plus the commit-bound name selects
      # exactly the package the certified run produced.
      - name: Download exact CI package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ needs.gate.outputs.tested_sha }}
          path: release-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.gate.outputs.run_id }}

      - name: Recheck downloaded archive without repacking the repository
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
          TESTED_SHA: ${{ needs.gate.outputs.tested_sha }}
        shell: bash
        run: |
          shopt -s nullglob
          tarballs=(release-artifact/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "expected exactly one CI package archive"
            exit 1
          fi
          npm run test:package -- --tarball "${tarballs[0]}" --source-commit "$TESTED_SHA"

      # Sends the checked tgz to npm with scripts disabled, then downloads it
      # from the registry and compares digests and inventory before creating
      # the local release tag.
      - name: Publish with provenance
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          PACKAGE_ARTIFACT_DIR: release-artifact
          PACKAGE_SOURCE_COMMIT: ${{ needs.gate.outputs.tested_sha }}
          SOURCE_DATE_EPOCH: ${{ steps.source_date.outputs.epoch }}
        run: npm run release

      - name: Push the release tag and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_SOURCE_COMMIT: ${{ needs.gate.outputs.tested_sha }}
        run: npx tsx scripts/github-release.ts

      # Installs what the registry actually serves, in a directory with no
      # workspace, lockfile or local dist, and imports every Node-reachable
      # subpath. It cannot prevent the publish; it makes a broken one loud.
      - name: Smoke-test the published package from the registry
        run: npm run test:smoke
